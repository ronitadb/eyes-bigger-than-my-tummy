<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{if(sessionStorage.getItem("cms-auth"))document.documentElement.setAttribute("data-authing","");}catch(e){}</script>
<meta name="robots" content="noindex, nofollow">
<title>עריכת תוכן האתר</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Assistant',sans-serif;background:#f5f5f0;color:#22302F;min-height:100vh}
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  html[data-authing] #login{display:none}
  .login-box{background:#fff;border:1px solid #ddd;border-radius:6px;padding:40px;max-width:360px;width:100%;text-align:center}
  .login-box h1{font-size:22px;color:#3D7468;margin-bottom:24px}
  .login-box input{width:100%;padding:12px;border:1px solid #ccc;border-radius:4px;font-size:16px;font-family:inherit;margin-bottom:14px}
  .login-box button{width:100%;padding:12px;background:#3D7468;color:#fff;border:none;border-radius:4px;font-size:16px;font-family:inherit;font-weight:600;cursor:pointer}
  .login-box .err{color:#c44;font-size:14px;margin-top:10px}
  .app{display:none;max-width:760px;margin:0 auto;padding:20px}
  .header{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid #ddd;margin-bottom:24px}
  .header h1{font-size:22px;color:#3D7468}
  .header-links{display:flex;gap:16px;align-items:center}
  .header-links a{font-size:14px;color:#3D7468;text-decoration:none;font-weight:600}
  .page-section{margin-bottom:32px}
  .page-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#fff;border:1px solid #ddd;border-radius:6px;cursor:pointer;user-select:none}
  .page-header:hover{background:#f9f9f7}
  .page-header h2{font-size:17px;color:#2F5248;font-weight:700}
  .page-header .arrow{font-size:12px;color:#6E7C78;transition:transform .2s}
  .page-section.open .page-header .arrow{transform:rotate(180deg)}
  .page-body{display:none;padding:0 2px;margin-top:12px}
  .page-section.open .page-body{display:block}
  .block-card{background:#fff;border:1px solid #ddd;border-radius:6px;padding:18px;margin-bottom:12px}
  .block-card label{display:block;font-size:14px;font-weight:600;color:#3A4744;margin-bottom:8px}
  .block-card textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;font-size:15px;font-family:inherit;min-height:70px;resize:vertical;line-height:1.7}
  .block-card textarea:focus{outline:none;border-color:#3D7468;box-shadow:0 0 0 2px rgba(61,116,104,.12)}
  .block-actions{display:flex;gap:8px;align-items:center;margin-top:10px}
  .btn{display:inline-block;padding:8px 18px;background:#3D7468;color:#fff;border:none;border-radius:4px;font-size:14px;font-family:inherit;font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .btn-small{padding:6px 14px;font-size:13px}
  .btn-reset{background:none;color:#999;border:1px solid #ddd;font-weight:400}
  .btn-reset:hover{background:#f5f5f0}
  .block-status{font-size:12px;color:#999;margin-right:auto}
  .block-status.saved{color:#3D7468}
  .msg{padding:10px 14px;border-radius:4px;margin-bottom:16px;font-size:14px}
  .msg-ok{background:#d4edda;color:#155724}
  .msg-err{background:#f8d7da;color:#721c24}
  .placeholder-hint{font-size:12px;color:#999;margin-top:4px}
</style>
</head>
<body>

<div id="login" class="login-wrap">
  <div class="login-box">
    <h1>עריכת תוכן האתר</h1>
    <input type="password" id="pw" placeholder="סיסמת ניהול" autocomplete="current-password">
    <button onclick="doLogin()">כניסה</button>
    <div id="loginErr" class="err"></div>
  </div>
</div>

<div id="app" class="app">
  <div class="header">
    <h1>עריכת תוכן האתר</h1>
    <nav class="header-links" style="flex-wrap:wrap">
      <a href="/admin" style="color:#8A9692;font-size:13px">מרכז</a>
      <a href="/admin/content" style="color:#2F5248;font-weight:700;border-bottom:2px solid #3D7468;padding-bottom:2px">תוכן</a>
      <a href="/admin/stories">ספרייה</a>
      <a href="/admin/zoom">מפגשים</a>
      <button class="btn-small btn-reset" onclick="doLogout()">יציאה</button>
    </nav>
  </div>
  <div id="msgArea"></div>
  <div id="pages"></div>
</div>

<script>
var API='/api/admin/content';
var PW='';
var savedBlocks={};

var PAGES=[
  {slug:'index',name:'עמוד הבית',blocks:[
    {id:'hero-subtitle',label:'כותרת משנה'},
    {id:'hero-description',label:'תיאור ראשי'},
    {id:'book-paragraph',label:'על הספר — תיאור'},
    {id:'author-bio',label:'על המחברת — ביוגרפיה'},
    {id:'zoom-description',label:'מפגשי זום — תיאור'},
    {id:'quote-1',label:'ציטוט ראשון'},
    {id:'quote-1-cite',label:'ציטוט ראשון — מקור'},
    {id:'quote-2',label:'ציטוט שני'},
    {id:'quote-2-cite',label:'ציטוט שני — מקור'},
  ]},
  {slug:'book',name:'הספר',blocks:[
    {id:'opening-quote',label:'ציטוט פתיחה מהספר'},
    {id:'cover-caption',label:'כיתוב מתחת לעטיפה'},
    {id:'story-paragraph',label:'הסיפור — תיאור'},
    {id:'language-paragraph',label:'השפה — תיאור'},
    {id:'questions-paragraph',label:'השאלות — תיאור'},
  ]},
  {slug:'ronit',name:'רונית',blocks:[
    {id:'tagline',label:'תגית מתחת לשם'},
    {id:'about-bio',label:'על המחברת — ביוגרפיה'},
  ]},
  {slug:'media',name:'תקשורת וביקורות',blocks:[
    {id:'subtitle',label:'כותרת משנה'},
  ]},
  {slug:'zoom',name:'מפגשי זום — עמוד הרשמה',blocks:[
    {id:'subtitle',label:'כותרת משנה'},
    {id:'body-paragraph-1',label:'גוף — פסקה ראשונה (זיכרונות)'},
    {id:'body-paragraph-2',label:'גוף — פסקה שנייה (הזמנה)'},
    {id:'body-paragraph-3',label:'גוף — פסקה שלישית (מפגשים פתוחים)'},
    {id:'body-paragraph-4',label:'גוף — פסקה רביעית (טקסים)'},
    {id:'body-question-1',label:'שאלה ראשונה'},
    {id:'body-question-2',label:'שאלה שנייה'},
    {id:'body-question-3',label:'שאלה שלישית'},
    {id:'body-motto-1',label:'מוטו — שורה 1'},
    {id:'body-motto-2',label:'מוטו — שורה 2'},
    {id:'body-motto-3',label:'מוטו — שורה 3'},
    {id:'body-motto-4',label:'מוטו — שורה 4'},
    {id:'body-motto-5',label:'מוטו — שורה 5'},
    {id:'body-closing',label:'גוף — פסקת סיום'},
    {id:'body-closing-quote',label:'ציטוט סיום'},
    {id:'form-description',label:'תיאור טופס ההרשמה'},
  ]},
  {slug:'materials',name:'הספרייה המשותפת',blocks:[
    {id:'subtitle',label:'כותרת משנה'},
  ]},
  {slug:'contact',name:'צור קשר',blocks:[
    {id:'intro',label:'טקסט פתיחה'},
  ]},
];

function headers(){return{'Content-Type':'application/json','x-admin-password':PW}}

function showMsg(text,ok){
  var el=document.getElementById('msgArea');
  el.innerHTML='<div class="msg '+(ok?'msg-ok':'msg-err')+'">'+esc(text)+'</div>';
  setTimeout(function(){el.innerHTML=''},4000);
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function enterApp(data){
  savedBlocks={};
  data.blocks.forEach(function(b){
    savedBlocks[b.page_slug+'/'+b.block_id]=b.content;
  });
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  renderPages();
}

function doLogin(){
  PW=document.getElementById('pw').value;
  fetch(API,{headers:headers()})
    .then(function(r){
      if(!r.ok)throw new Error('wrong');
      return r.json();
    })
    .then(function(data){
      sessionStorage.setItem('cms-auth',PW);
      enterApp(data);
    })
    .catch(function(){
      document.getElementById('loginErr').textContent='סיסמה שגויה';
    });
}

function doLogout(){
  PW='';
  savedBlocks={};
  sessionStorage.removeItem('cms-auth');
  document.getElementById('app').style.display='none';
  document.getElementById('login').style.display='flex';
  document.getElementById('pw').value='';
  document.getElementById('loginErr').textContent='';
}

(function(){
  var s=sessionStorage.getItem('cms-auth');
  if(!s)return;
  PW=s;
  fetch(API,{headers:headers()})
    .then(function(r){if(!r.ok)throw new Error('x');return r.json();})
    .then(function(data){enterApp(data);})
    .catch(function(){PW='';sessionStorage.removeItem('cms-auth');document.documentElement.removeAttribute('data-authing');});
})();

function renderPages(){
  var container=document.getElementById('pages');
  var html='';
  PAGES.forEach(function(page){
    html+='<div class="page-section" id="section-'+page.slug+'">';
    html+='<div class="page-header" onclick="toggleSection(\''+page.slug+'\')">';
    html+='<h2>'+esc(page.name)+'</h2>';
    html+='<span class="arrow">▼</span>';
    html+='</div>';
    html+='<div class="page-body">';
    page.blocks.forEach(function(block){
      var key=page.slug+'/'+block.id;
      var val=savedBlocks[key]||'';
      html+='<div class="block-card" id="card-'+page.slug+'-'+block.id+'">';
      html+='<label>'+esc(block.label)+'</label>';
      html+='<textarea id="txt-'+page.slug+'-'+block.id+'" data-key="'+key+'">'+esc(val)+'</textarea>';
      if(!val) html+='<div class="placeholder-hint">ריק = משתמש בטקסט שנמצא בקוד האתר</div>';
      html+='<div class="block-actions">';
      html+='<button class="btn btn-small" onclick="saveBlock(\''+page.slug+'\',\''+block.id+'\')">שמירה</button>';
      if(val) html+='<button class="btn btn-small btn-reset" onclick="resetBlock(\''+page.slug+'\',\''+block.id+'\')">איפוס לברירת מחדל</button>';
      html+='<span class="block-status" id="status-'+page.slug+'-'+block.id+'">'+(val?'נערך':'')+'</span>';
      html+='</div>';
      html+='</div>';
    });
    html+='</div></div>';
  });
  container.innerHTML=html;
}

function toggleSection(slug){
  document.getElementById('section-'+slug).classList.toggle('open');
}

function saveBlock(pageSlug,blockId){
  var textarea=document.getElementById('txt-'+pageSlug+'-'+blockId);
  var content=textarea.value;
  var key=pageSlug+'/'+blockId;

  fetch(API,{
    method:'PUT',
    headers:headers(),
    body:JSON.stringify({page_slug:pageSlug,block_id:blockId,content:content})
  })
  .then(function(r){return r.json()})
  .then(function(data){
    if(!data.ok){showMsg('שגיאה בשמירה',false);return}
    if(data.action==='deleted'){
      delete savedBlocks[key];
    } else {
      savedBlocks[key]=content;
    }
    renderPages();
    showMsg('נשמר בהצלחה',true);
  })
  .catch(function(){showMsg('שגיאה בשמירה',false)});
}

function resetBlock(pageSlug,blockId){
  var key=pageSlug+'/'+blockId;
  fetch(API,{
    method:'DELETE',
    headers:headers(),
    body:JSON.stringify({page_slug:pageSlug,block_id:blockId})
  })
  .then(function(r){return r.json()})
  .then(function(){
    delete savedBlocks[key];
    renderPages();
    showMsg('אופס לברירת מחדל',true);
  })
  .catch(function(){showMsg('שגיאה',false)});
}

document.getElementById('pw').addEventListener('keydown',function(e){
  if(e.key==='Enter')doLogin();
});
</script>
</body>
</html>
