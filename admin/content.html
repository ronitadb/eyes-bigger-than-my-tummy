<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{if(sessionStorage.getItem("cms-auth"))document.documentElement.setAttribute("data-authing","");}catch(e){}</script>
<meta name="robots" content="noindex, nofollow">
<title>עריכת תוכן האתר</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Assistant',sans-serif;background:#f5f5f0;color:#22302F;min-height:100vh}
  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  html[data-authing] #login{display:none}
  .login-box{background:#fff;border:1px solid #ddd;border-radius:6px;padding:40px;max-width:360px;width:100%;text-align:center}
  .login-box h1{font-size:22px;color:#3D7468;margin-bottom:24px}
  .login-box input{width:100%;padding:12px;border:1px solid #ccc;border-radius:4px;font-size:16px;font-family:inherit;margin-bottom:14px}
  .login-box button{width:100%;padding:12px;background:#3D7468;color:#fff;border:none;border-radius:4px;font-size:16px;font-family:inherit;font-weight:600;cursor:pointer}
  .login-box .err{color:#c44;font-size:14px;margin-top:10px}
  .app{display:none;max-width:760px;margin:0 auto;padding:20px}
  .header{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid #ddd;margin-bottom:24px}
  .header h1{font-size:22px;color:#3D7468}
  .header-links{display:flex;gap:16px;align-items:center}
  .header-links a{font-size:14px;color:#3D7468;text-decoration:none;font-weight:600}
  .page-section{margin-bottom:32px}
  .page-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#fff;border:1px solid #ddd;border-radius:6px;cursor:pointer;user-select:none}
  .page-header:hover{background:#f9f9f7}
  .page-header h2{font-size:17px;color:#2F5248;font-weight:700}
  .page-header .arrow{font-size:12px;color:#6E7C78;transition:transform .2s}
  .page-section.open .page-header .arrow{transform:rotate(180deg)}
  .page-body{display:none;padding:0 2px;margin-top:12px}
  .page-section.open .page-body{display:block}
  .block-card{background:#fff;border:1px solid #ddd;border-radius:6px;padding:18px;margin-bottom:12px}
  .block-card label{display:block;font-size:14px;font-weight:600;color:#3A4744;margin-bottom:8px}
  .block-card textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;font-size:15px;font-family:inherit;min-height:70px;resize:vertical;line-height:1.7}
  .block-card textarea:focus{outline:none;border-color:#3D7468;box-shadow:0 0 0 2px rgba(61,116,104,.12)}
  .block-actions{display:flex;gap:8px;align-items:center;margin-top:10px}
  .btn{display:inline-block;padding:8px 18px;background:#3D7468;color:#fff;border:none;border-radius:4px;font-size:14px;font-family:inherit;font-weight:600;cursor:pointer}
  .btn:disabled{opacity:.5;cursor:default}
  .btn-small{padding:6px 14px;font-size:13px}
  .btn-reset{background:none;color:#999;border:1px solid #ddd;font-weight:400}
  .btn-reset:hover{background:#f5f5f0}
  .block-status{font-size:12px;color:#999;margin-right:auto}
  .block-status.saved{color:#3D7468}
  .msg{padding:10px 14px;border-radius:4px;margin-bottom:16px;font-size:14px}
  .msg-ok{background:#d4edda;color:#155724}
  .msg-err{background:#f8d7da;color:#721c24}
  .placeholder-hint{font-size:12px;color:#999;margin-top:4px}
</style>
</head>
<body>

<div id="login" class="login-wrap">
  <div class="login-box">
    <h1>עריכת תוכן האתר</h1>
    <input type="password" id="pw" placeholder="סיסמת ניהול" autocomplete="current-password">
    <button onclick="doLogin()">כניסה</button>
    <div id="loginErr" class="err"></div>
  </div>
</div>

<div id="app" class="app">
  <div class="header">
    <h1>עריכת תוכן האתר</h1>
    <nav class="header-links" style="flex-wrap:wrap">
      <a href="/admin" style="color:#8A9692;font-size:13px">מרכז</a>
      <a href="/admin/content" style="color:#2F5248;font-weight:700;border-bottom:2px solid #3D7468;padding-bottom:2px">תוכן</a>
      <a href="/admin/stories">ספרייה</a>
      <a href="/admin/zoom">מפגשים</a>
      <button class="btn-small btn-reset" onclick="doLogout()">יציאה</button>
    </nav>
  </div>
  <div id="msgArea"></div>
  <div id="pages"></div>
</div>

<script>
var API='/api/admin/content';
var PW='';
var overrides={};   // "slug/block_id" -> saved content (override)
var defaults={};    // "slug/block_id" -> the real current text from the site code
var order={};       // slug -> [block_id, ...] in page order

var PAGES=[
  {slug:'index',    url:'/',          name:'עמוד הבית'},
  {slug:'book',     url:'/book',      name:'הספר'},
  {slug:'ronit',    url:'/ronit',     name:'רונית'},
  {slug:'zoom',     url:'/zoom',      name:'מפגשי זום'},
  {slug:'materials',url:'/materials', name:'הספרייה המשותפת'},
  {slug:'media',    url:'/media',     name:'תקשורת וביקורות'},
  {slug:'contact',  url:'/contact',   name:'צור קשר'},
  {slug:'door',     url:'/door',      name:'הדלת — הקליניקה (עברית + English)'}
];

var LABELS={
  'hero-subtitle':'כותרת משנה','hero-description':'תיאור ראשי','book-paragraph':'על הספר — תיאור',
  'author-bio':'על המחברת — ביוגרפיה','zoom-description':'מפגשי זום — תיאור',
  'quote-1':'ציטוט ראשון','quote-1-cite':'ציטוט ראשון — מקור','quote-2':'ציטוט שני','quote-2-cite':'ציטוט שני — מקור',
  'opening-quote':'ציטוט פתיחה מהספר','cover-caption':'כיתוב מתחת לעטיפה','story-paragraph':'הסיפור — תיאור',
  'language-paragraph':'השפה — תיאור','questions-paragraph':'השאלות — תיאור',
  'tagline':'תגית מתחת לשם','about-bio':'על המחברת — ביוגרפיה',
  'subtitle':'כותרת משנה','intro':'טקסט פתיחה',
  'body-paragraph-1':'פסקה ראשונה','body-paragraph-2':'פסקה שנייה','body-paragraph-3':'פסקה שלישית',
  'body-closing-quote':'ציטוט סיום','form-description':'תיאור טופס ההרשמה'
};
function preview(t){ t=String(t==null?'':t).replace(/\s+/g,' ').trim(); return t ? (t.length>52 ? t.slice(0,52)+'…' : t) : '(ריק)'; }
function labelFor(id,val){ return LABELS[id] || preview(val); }

function headers(){return{'Content-Type':'application/json','x-admin-password':PW}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function showMsg(text,ok){
  var el=document.getElementById('msgArea');
  el.innerHTML='<div class="msg '+(ok?'msg-ok':'msg-err')+'">'+esc(text)+'</div>';
  setTimeout(function(){el.innerHTML=''},4000);
}
function key(slug,id){return slug+'/'+id;}
function currentValue(k){ return (k in overrides) ? overrides[k] : (defaults[k]||''); }

// Turn a page element's HTML into the plain, line-broken text shown in the editor.
function extractText(el){
  var html=el.innerHTML.replace(/<br\s*\/?>/gi,'\n');
  var tmp=document.createElement('div'); tmp.innerHTML=html;
  var t=tmp.textContent||'';
  return t.replace(/ /g,' ').replace(/[ \t]+/g,' ').replace(/ *\n */g,'\n').replace(/\n{3,}/g,'\n\n').trim();
}

// Fetch each page and read its real editable text (the data-cms spots), in page order.
function loadDefaults(){
  return Promise.all(PAGES.map(function(p){
    return fetch(p.url,{cache:'no-store'}).then(function(r){return r.text();}).then(function(html){
      var doc=new DOMParser().parseFromString(html,'text/html');
      var els=doc.querySelectorAll('[data-cms]');
      order[p.slug]=[];
      for(var i=0;i<els.length;i++){
        var id=els[i].getAttribute('data-cms');
        order[p.slug].push(id);
        defaults[key(p.slug,id)]=extractText(els[i]);
      }
    }).catch(function(){ if(!order[p.slug]) order[p.slug]=[]; });
  }));
}

function enterApp(data){
  overrides={};
  ((data&&data.blocks)||[]).forEach(function(b){ overrides[key(b.page_slug,b.block_id)]=b.content; });
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('pages').innerHTML='<div style="text-align:center; color:#8A9692; padding:50px 20px;">טוען את תוכן העמודים…</div>';
  loadDefaults().then(renderPages);
}

function doLogin(){
  PW=document.getElementById('pw').value;
  fetch(API,{headers:headers()})
    .then(function(r){ if(!r.ok)throw new Error('wrong'); return r.json(); })
    .then(function(data){ sessionStorage.setItem('cms-auth',PW); enterApp(data); })
    .catch(function(){ document.getElementById('loginErr').textContent='סיסמה שגויה'; });
}

function doLogout(){
  PW=''; overrides={}; defaults={}; order={};
  sessionStorage.removeItem('cms-auth');
  document.getElementById('app').style.display='none';
  document.getElementById('login').style.display='flex';
  document.getElementById('pw').value='';
  document.getElementById('loginErr').textContent='';
}

(function(){
  var s=sessionStorage.getItem('cms-auth');
  if(!s)return;
  PW=s;
  fetch(API,{headers:headers()})
    .then(function(r){if(!r.ok)throw new Error('x');return r.json();})
    .then(function(data){enterApp(data);})
    .catch(function(){PW='';sessionStorage.removeItem('cms-auth');document.documentElement.removeAttribute('data-authing');});
})();

function renderPages(){
  var container=document.getElementById('pages');
  var html='';
  PAGES.forEach(function(page){
    var ids=order[page.slug]||[];
    html+='<div class="page-section" id="section-'+page.slug+'">';
    html+='<div class="page-header" onclick="toggleSection(\''+page.slug+'\')">';
    html+='<h2>'+esc(page.name)+' <span style="font-size:13px; color:#8A9692; font-weight:400;">('+ids.length+')</span></h2>';
    html+='<span class="arrow">▼</span>';
    html+='</div>';
    html+='<div class="page-body">';
    if(!ids.length){ html+='<div class="placeholder-hint" style="padding:6px 2px 2px;">אין טקסטים ניתנים לעריכה בעמוד זה.</div>'; }
    ids.forEach(function(id){
      var k=key(page.slug,id);
      var edited=(k in overrides);
      var val=currentValue(k);
      html+='<div class="block-card" id="card-'+page.slug+'-'+id+'">';
      html+='<label>'+esc(labelFor(id,val))+'</label>';
      html+='<textarea id="txt-'+page.slug+'-'+id+'" data-key="'+k+'">'+esc(val)+'</textarea>';
      html+='<div class="block-actions">';
      html+='<button class="btn btn-small" onclick="saveBlock(\''+page.slug+'\',\''+id+'\')">שמירה</button>';
      html+='<button class="btn btn-small btn-reset" id="reset-'+page.slug+'-'+id+'" onclick="resetBlock(\''+page.slug+'\',\''+id+'\')"'+(edited?'':' style="display:none"')+'>שחזור לטקסט המקורי</button>';
      html+='<span class="block-status'+(edited?' saved':'')+'" id="status-'+page.slug+'-'+id+'">'+(edited?'נערך · גרסה שמורה':'טקסט האתר')+'</span>';
      html+='</div>';
      html+='</div>';
    });
    html+='</div></div>';
  });
  container.innerHTML=html;
}

function toggleSection(slug){ document.getElementById('section-'+slug).classList.toggle('open'); }

function saveBlock(pageSlug,blockId){
  var k=key(pageSlug,blockId);
  var content=document.getElementById('txt-'+pageSlug+'-'+blockId).value;
  fetch(API,{method:'PUT',headers:headers(),body:JSON.stringify({page_slug:pageSlug,block_id:blockId,content:content})})
    .then(function(r){return r.json()})
    .then(function(data){
      if(!data.ok){showMsg('שגיאה בשמירה',false);return}
      overrides[k]=content;
      var st=document.getElementById('status-'+pageSlug+'-'+blockId); if(st){st.textContent='נערך · גרסה שמורה'; st.classList.add('saved');}
      var rb=document.getElementById('reset-'+pageSlug+'-'+blockId); if(rb) rb.style.display='';
      showMsg('נשמר בהצלחה',true);
    })
    .catch(function(){showMsg('שגיאה בשמירה',false)});
}

function resetBlock(pageSlug,blockId){
  var k=key(pageSlug,blockId);
  fetch(API,{method:'DELETE',headers:headers(),body:JSON.stringify({page_slug:pageSlug,block_id:blockId})})
    .then(function(r){return r.json()})
    .then(function(){
      delete overrides[k];
      var ta=document.getElementById('txt-'+pageSlug+'-'+blockId); if(ta) ta.value=defaults[k]||'';
      var st=document.getElementById('status-'+pageSlug+'-'+blockId); if(st){st.textContent='טקסט האתר'; st.classList.remove('saved');}
      var rb=document.getElementById('reset-'+pageSlug+'-'+blockId); if(rb) rb.style.display='none';
      showMsg('שוחזר לטקסט המקורי',true);
    })
    .catch(function(){showMsg('שגיאה',false)});
}

document.getElementById('pw').addEventListener('keydown',function(e){
  if(e.key==='Enter')doLogin();
});
</script>
</body>
</html>
