<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פתיח</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'David Libre',David,'Times New Roman',serif}

.bg{position:fixed;inset:0;background:#FAF8F4;z-index:0}

.stage{
  position:relative;z-index:1;
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
}

.text-block{
  position:absolute;
  max-width:720px;
  padding:0 40px;
  text-align:center;
  opacity:0;
  transform:translateY(12px);
  transition:opacity 1.2s ease, transform 1.2s ease;
  pointer-events:none;
  font-size:28px;
  line-height:1.9;
  color:#22302F;
  font-weight:400;
}
.text-block.visible{
  opacity:1;
  transform:translateY(0);
}
.text-block.fading{
  opacity:0;
  transform:translateY(-8px);
}

.progress{
  position:fixed;bottom:0;left:0;right:0;height:2px;z-index:10;
  background:rgba(61,116,104,.1);
}
.progress-bar{
  height:100%;width:0;
  background:rgba(61,116,104,.3);
  transition:width 0.3s linear;
}

.click-hint{
  position:fixed;bottom:40px;left:50%;transform:translateX(-50%);
  font-size:14px;color:rgba(61,116,104,.4);
  font-family:-apple-system,sans-serif;
  z-index:10;
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.8}}

.walker{
  position:fixed;
  bottom:60px;
  z-index:2;
  opacity:0;
  transition:opacity 1s ease;
}
.walker.active{opacity:.18}

@keyframes walk{
  0%{right:-80px}
  100%{right:calc(100% + 80px)}
}
</style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

<div class="bg"></div>

<div class="walker" id="walker">
  <svg width="55" height="80" viewBox="0 0 55 80" fill="none" xmlns="http://www.w3.org/2000/svg">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="0.25s" repeatCount="indefinite"/>

      <circle cx="28" cy="12" r="6" stroke="#3D7468" stroke-width="2"/>

      <line x1="28" y1="18" x2="26" y2="46" stroke="#3D7468" stroke-width="2" stroke-linecap="round"/>

      <line x1="27" y1="24" stroke="#3D7468" stroke-width="2" stroke-linecap="round">
        <animate attributeName="x2" values="19;35;19" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="32;30;32" dur="0.5s" repeatCount="indefinite"/>
      </line>
      <line stroke="#3D7468" stroke-width="2" stroke-linecap="round">
        <animate attributeName="x1" values="19;35;19" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y1" values="32;30;32" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="15;37;15" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="25;36;25" dur="0.5s" repeatCount="indefinite"/>
      </line>

      <line x1="27" y1="24" stroke="#3D7468" stroke-width="2" stroke-linecap="round">
        <animate attributeName="x2" values="35;19;35" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="30;32;30" dur="0.5s" repeatCount="indefinite"/>
      </line>
      <line stroke="#3D7468" stroke-width="2" stroke-linecap="round">
        <animate attributeName="x1" values="35;19;35" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y1" values="30;32;30" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="37;15;37" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="36;25;36" dur="0.5s" repeatCount="indefinite"/>
      </line>

      <line x1="26" y1="46" stroke="#3D7468" stroke-width="2" stroke-linecap="round">
        <animate attributeName="x2" values="34;16;34" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="58;34;58" dur="0.5s" repeatCount="indefinite"/>
      </line>
      <line stroke="#3D7468" stroke-width="2" stroke-linecap="round">
        <animate attributeName="x1" values="34;16;34" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y1" values="58;34;58" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="38;20;38" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="72;48;72" dur="0.5s" repeatCount="indefinite"/>
      </line>

      <line x1="26" y1="46" stroke="#3D7468" stroke-width="2" stroke-linecap="round">
        <animate attributeName="x2" values="16;34;16" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="34;58;34" dur="0.5s" repeatCount="indefinite"/>
      </line>
      <line stroke="#3D7468" stroke-width="2" stroke-linecap="round">
        <animate attributeName="x1" values="16;34;16" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y1" values="34;58;34" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="x2" values="20;38;20" dur="0.5s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="48;72;48" dur="0.5s" repeatCount="indefinite"/>
      </line>
    </g>
  </svg>
</div>

<div class="stage" id="stage"></div>

<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="click-hint" id="hint">לחצו להתחיל</div>

<script>
var scenes = [
  { text: 'היי אמא.', hold: 2500 },
  { text: 'היי!', hold: 2000 },
  { text: 'אני כותב מטלה באוניברסיטה על החינוך המשותף שאת גדלת בו,\nואני צריך להשוות למקומות אחרים שגידלו ככה.\nזה לא עובד.', hold: 7000 },
  { text: 'למה? מה לא עובד?', hold: 2500 },
  { text: 'אני שם במילות חיפוש בגוגל\n״ילדים שלא גודלו על ידי ההורים שלהם״.\n\nמה שעולה לי זה ילדים שהתייתמו,\nאו שההורים שלהם לא היו כשירים.\nאימוץ.\nאומנה.', hold: 8000 },
  { text: 'תחפש ״ילדים שלא גודלו על ידי ההורים שלהם\nוגודלו בקבוצה״.', hold: 5000 },
  { text: 'אוקיי, מחפש..\nעולים לי בתי יתומים ופנימיות.\nזה לא זה.', hold: 5000 },
  { text: 'אוקיי...\nתחפש ילדים שלא גודלו על ידי ההורים שלהם,\nוגודלו בקבוצה,\nכשההורים שלהם היו עם מסוגלות הורית.', hold: 6000 },
  { text: 'אוי...\nעולה לי ספרטה העתיקה...\nוגם שם הילדים עברו לחינוך קבוצתי רק בגיל שבע.\nוהבנות בכלל נשארו בבית.\nזה לא זה.', hold: 7000 },
  { text: 'אז מה זה אומר?', hold: 3000 },
  { text: 'זה אומר –\nשיש ילדים שגדלו בלי ההורים שלהם.\nויש ילדים שגדלו בקבוצה.\nויש ילדים שגדלו במסגרות חלופיות\nכי ההורים שלהם לא יכלו לגדל אותם.', hold: 8000 },
  { text: 'אבל כנראה שאין עוד מסגרות של ילדים\nשגם גדלו בקבוצה מינקות,\nגם גודלו על ידי אנשים שהם לא ההורים שלהם,\nוגם שההורים שלהם בחיים, מתפקדים וכשירים.', hold: 10000 },
];

var FADE_IN = 1200;
var FADE_OUT = 800;
var stage = document.getElementById('stage');
var bar = document.getElementById('progressBar');
var hint = document.getElementById('hint');
var walker = document.getElementById('walker');
var totalTime = 0;
var started = false;

for (var i = 0; i < scenes.length; i++) {
  totalTime += FADE_IN + scenes[i].hold + FADE_OUT + 200;
}

function formatText(text) {
  var lines = text.split('\n');
  var html = '';
  for (var j = 0; j < lines.length; j++) {
    if (lines[j] === '') {
      html += '<br>';
    } else {
      html += (j > 0 ? '<br>' : '') + lines[j];
    }
  }
  return html;
}

function run() {
  if (started) return;
  started = true;
  hint.style.display = 'none';

  walker.classList.add('active');
  walker.style.animation = 'walk ' + (totalTime / 1000) + 's linear forwards';

  var startTime = Date.now();

  function updateProgress() {
    var pct = Math.min(100, ((Date.now() - startTime) / totalTime) * 100);
    bar.style.width = pct + '%';
    if (pct < 100) requestAnimationFrame(updateProgress);
  }
  requestAnimationFrame(updateProgress);

  var delay = 0;
  for (var i = 0; i < scenes.length; i++) {
    (function(scene, d) {
      setTimeout(function() {
        var el = document.createElement('div');
        el.className = 'text-block';
        el.innerHTML = formatText(scene.text);
        stage.appendChild(el);

        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            el.classList.add('visible');
          });
        });

        setTimeout(function() {
          el.classList.remove('visible');
          el.classList.add('fading');
          setTimeout(function() {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, FADE_OUT);
        }, FADE_IN + scene.hold);
      }, d);
    })(scenes[i], delay);

    delay += FADE_IN + scenes[i].hold + FADE_OUT + 200;
  }
}

document.addEventListener('click', run);
document.addEventListener('keydown', function(e) {
  if (e.code === 'Space' || e.code === 'Enter') run();
});
</script>
</body>
</html>
